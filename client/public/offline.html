<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estúdio indisponível offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090d17; color: #eaf0ff; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { max-width: 420px; text-align: center; }
      h1 { font-size: 1.4rem; }
      p { color: #a9b5c8; line-height: 1.6; }
      button { border: 0; border-radius: 10px; background: #c6ff4d; color: #111827; cursor: pointer; font-weight: 700; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>O Estúdio está offline</h1>
      <p>Nenhum dado privado é exibido offline. Reconecte-se e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
