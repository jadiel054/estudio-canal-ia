name: Limpar render publicado

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: UUID do vídeo aprovado que o dono já baixou e publicou
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-cleanup-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remover Release temporário confirmado
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validar job e apagar somente seu draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.event.inputs.jobId }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          job_id = os.environ["JOB_ID"]
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", job_id, re.I):
              raise SystemExit("UUID inválido; nenhum Release foi alterado.")
          owner, repo = "jadiel054", "estudio-canal-ia"
          tag = f"studio-render-{job_id}"
          base = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "estudio-render-cleanup"}

          def request(method, url):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(2 * 1024 * 1024)
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  raise SystemExit(f"GitHub recusou a limpeza (HTTP {error.code}).")

          status, release = request("GET", f"{base}/releases/tags/{tag}")
          if status == 404:
              print("Release já removido; verificando apenas a tag exata do job.")
          else:
              if release.get("tag_name") != tag or release.get("draft") is not True:
                  raise SystemExit("Release não corresponde exatamente ao draft privado esperado; nada foi removido.")
              request("DELETE", f"{base}/releases/{release['id']}")
          request("DELETE", f"{base}/git/refs/tags/{tag}")
          print("Draft Release, assets e tag temporários removidos.")
          PY
